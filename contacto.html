<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contacto | PEPO MUSIC SOUND</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>

        body {
            margin: 0;
            background: linear-gradient(135deg, #f7f2ff, #eadcff);
            min-height: 100vh;
        }

        /* Barra de navegación */

        .navbar {
            background-color: #ffffff !important;
            border-bottom: 1px solid #ddd;
        }

        .navbar .nav-link {
            color: #555;
            font-size: 16px;
            transition: 0.3s;
        }

        .navbar .nav-link:hover {
            color: #7b2cbf;
        }

        /* Contenedor del formulario */

        .contenedor-contacto {
            width: 90%;
            max-width: 650px;
            margin: 60px auto;
        }

        .tarjeta-contacto {
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        .titulo {
            text-align: center;
            color: #6f2dbd;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .descripcion {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .campo {
            margin-bottom: 20px;
        }

        .campo label {
            font-weight: bold;
            margin-bottom: 7px;
            display: block;
            color: #333;
        }

        .campo input,
        .campo textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 10px;
            outline: none;
            transition: 0.3s;
        }

        .campo input:focus,
        .campo textarea:focus {
            border-color: #7b2cbf;
            box-shadow: 0 0 5px rgba(123, 44, 191, 0.25);
        }

        .campo textarea {
            height: 140px;
            resize: vertical;
        }

        .boton-enviar {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: #7b2cbf;
            color: white;
            font-size: 17px;
            font-weight: bold;
            transition: 0.3s;
        }

        .boton-enviar:hover {
            background: #5a189a;
        }

        .boton-enviar:disabled {
            background: #999;
            cursor: not-allowed;
        }

        #resultado {
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
        }

        .icono-contacto {
            text-align: center;
            font-size: 45px;
            color: #7b2cbf;
            margin-bottom: 10px;
        }

    </style>
</head>


<body>


<!-- =====================================================
     BARRA DE NAVEGACIÓN
===================================================== -->

<nav class="navbar navbar-expand-lg">

    <div class="container">

        <a class="navbar-brand fw-bold" href="index.html">
            PEPO

        <button

            type="button"

                <li class="nav-item">
                    <a class="nav-link" href="quiz.html">
                        Quiz
                    </a>
                </li>

            </ul>

        </div>

    </div>

</nav>


<!-- =====================================================
     FORMULARIO
===================================================== -->

<div class="contenedor-contacto">

    <div class="tarjeta-contacto">

        <div class="icono-contacto">
            <i class="bi bi-chat-dots-fill"></i>
        </div>

        <h1 class="titulo">
            Contáctanos
        </h1>

        <p class="descripcion">
            Envíanos un mensaje y recibiremos tu información
            directamente en nuestro canal de Discord.
        </p>


        <form id="formularioContacto">

            <!-- Nombre -->

            <div class="campo">

                <label for="nombre">
                    <i class="bi bi-person-fill"></i>
                    Nombre
                </label>

                <input
                    type="text"
                    id="nombre"
                    placeholder="Escribe tu nombre"
                    required
                >

            </div>


            <!-- Correo -->

            <div class="campo">

                <label for="correo">
                    <i class="bi bi-envelope-fill"></i>
                    Correo electrónico
                </label>

                <input
                    type="email"
                    id="correo"
                    placeholder="ejemplo@gmail.com"
                    required
                >

            </div>


            <!-- Asunto -->

            <div class="campo">

                <label for="asunto">
                    <i class="bi bi-card-text"></i>
                    Asunto
                </label>

                <input
                    type="text"
                    id="asunto"
                    placeholder="¿Sobre qué quieres escribir?"
                    required
                >

            </div>


            <!-- Mensaje -->

            <div class="campo">

                <label for="mensaje">
                    <i class="bi bi-chat-left-text-fill"></i>
                    Mensaje
                </label>

                <textarea
                    id="mensaje"
                    placeholder="Escribe tu mensaje..."
                    required
                ></textarea>

            </div>


            <!-- Botón -->

            <button
                type="submit"
                class="boton-enviar"
                id="btnEnviar"
            >

                <i class="bi bi-send-fill"></i>
                Enviar mensaje

            </button>

        </form>


        <!-- Resultado -->

        <div id="resultado"></div>

    </div>

</div>


<!-- =====================================================
     JAVASCRIPT + JQUERY + DISCORD
===================================================== -->

<script>

$(document).ready(function() {


    // ==================================================
    // PEGA AQUÍ TU NUEVO WEBHOOK DE DISCORD
    // ==================================================

    const webhookURL = "https://discord.com/api/webhooks/1557494789639905280/XpsUancje2leoQzsvrobPdPN1qfiCxJ12djdSDAU1mAFkdQqFXjQPqJRMSUcGCYFaebs";


    // ==================================================
    // CUANDO SE ENVÍA EL FORMULARIO
    // ==================================================

    $("#formularioContacto").submit(function(event) {

        event.preventDefault();


        // Obtener información

        let nombre = $("#nombre").val();
        let correo = $("#correo").val();
        let asunto = $("#asunto").val();
        let mensaje = $("#mensaje").val();


        // Desactivar botón

        $("#btnEnviar")
            .prop("disabled", true)
            .html("Enviando...");


        // ==================================================
        // CREAR MENSAJE PARA DISCORD
        // ==================================================

        let datos = {

            content:

                "📩 **NUEVO MENSAJE - PEPO MUSIC SOUND**\n\n" +

                "👤 **Nombre:** " + nombre + "\n" +

                "📧 **Correo:** " + correo + "\n" +

                "📌 **Asunto:** " + asunto + "\n\n" +

                "💬 **Mensaje:**\n" +

                mensaje

        };


        // ==================================================
        // JQUERY AJAX
        // ==================================================

        $.ajax({

            url: webhookURL,

            type: "POST",

            contentType: "application/json",

            data: JSON.stringify(datos),


            // Si funciona

            success: function() {

                $("#resultado")
                    .text("✅ ¡Mensaje enviado correctamente!")
                    .css("color", "green");


                // Limpiar formulario

                $("#formularioContacto")[0].reset();


                // Restaurar botón

                $("#btnEnviar")
                    .prop("disabled", false)
                    .html('<i class="bi bi-send-fill"></i> Enviar mensaje');

            },


            // Si ocurre un error

            error: function(xhr, status, error) {

                console.log(error);

                $("#resultado")
                    .text("❌ No se pudo enviar el mensaje.")
                    .css("color", "red");


                $("#btnEnviar")
                    .prop("disabled", false)
                    .html('<i class="bi bi-send-fill"></i> Intentar nuevamente');

            }

        });

    });

});

</script>


<!-- Bootstrap JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


</body>
